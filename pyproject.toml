[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "run_analytics_pro"
version = "0.1.0"
description = "Analiza tempa, biomechaniki i fizjologii pojedynczego biegu"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Wielki Krzych", email = "krzysztof@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
]
dependencies = [
    "streamlit>=1.54.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "plotly>=5.18.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "reportlab>=4.0.0",
    "pyarrow>=14.0.0",
    "numba>=0.59.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "ruff",
    "mypy",
    "pytest-cov",
    "pre-commit>=3.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "services*"]

[tool.setuptools.package-data]
"modules.reporting" = ["DejaVuSans.ttf", "LICENSE-DejaVu.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --timeout=30"
testpaths = [
    "tests",
]
python_files = "test_*.py"

[tool.mypy]
explicit_package_bases = true
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
# Be lenient on first run; tighten to strict later.
disallow_untyped_defs = false
disallow_incomplete_defs = false
exclude = [
    "tests/",
    ".venv/",
    "build/",
]

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true
