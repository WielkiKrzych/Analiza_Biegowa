name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          if command -v ruff &> /dev/null; then
            ruff check .
          else
            echo "ruff not found, skipping lint"
          fi

      - name: Run tests
        run: python3 -m pytest -q --tb=short

      - name: Type-check with mypy
        # P3-5 / Faza 5 (audit v2): start with `ignore_missing_imports = true`
        # so the first green run is unblocked by missing third-party stubs.
        # Tighten `[tool.mypy]` incrementally as the codebase is annotated.
        run: |
          if command -v mypy &> /dev/null; then
            mypy modules/ services/ models/ --config-file pyproject.toml
          else
            echo "mypy not found, skipping type-check (install with: pip install mypy)"
          fi
