# bump2version configuration (P3-5, audit v2).
# Usage:
#   bump2version patch   # 0.1.0 -> 0.1.1
#   bump2version minor   # 0.1.0 -> 0.2.0
#   bump2version major   # 0.1.0 -> 1.0.0
#
# Each command updates pyproject.toml, commits the change, and tags
# the commit (without pushing). `git push --follow-tags` then publishes.

[bumpversion]
current_version = 0.1.0
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
serialize = {major}.{minor}.{patch}

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:README.md]
search = Run Analytics Pro v{current_version}
replace = Run Analytics Pro v{new_version}

[bumpversion:file:docs/CHANGELOG.md]
search = ## [{current_version}] - UNRELEASED
replace = ## [{new_version}] - {utcnow:%Y-%m-%d}
